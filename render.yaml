services:
  - type: web
    name: anime-ratings
    runtime: node
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anime-ratings-db
          property: connectionString

databases:
  - name: anime-ratings-db
    plan: free
    databaseName: anivoid
    user: anivoid
    ipAllowList: []
